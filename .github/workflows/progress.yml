name: Decompilation progress

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  report:
    if: github.repository == 'PascalPixel/alchemy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # make land verifies locally; the pre-push hook uploads before this run starts.
      - name: Download the verified report for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPORT_COMMIT: ${{ github.sha }}
        run: gh release download decomp-reports --pattern "${REPORT_COMMIT}.pb" --output report.pb

      # decomp.dev splits the native combined report into twelve named versions.
      - name: Upload all twelve editions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: combined_report
          path: report.pb
          if-no-files-found: error
          retention-days: 90
