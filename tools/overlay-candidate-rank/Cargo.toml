# Bare `[workspace]`: this crate is an independently buildable workspace
# rather than a member of the aggregate tools workspace. `version.workspace`
# and `edition.workspace` therefore cannot resolve, so both keys are literal.
[workspace]

[package]
name = "overlay-candidate-rank"
version = "0.1.0"
edition = "2021"

[dependencies]
# Sibling crates, not third-party dependencies: the already-landed Rust
# halves of the exact TypeScript modules `overlay_candidate_rank.ts` imports.
#   ./exact_reading_list.ts -> readingList, Pairing
exact-reading-list = { path = "../exact-reading-list" }
#   ../lib/overlay_disasm.ts -> assembleOverlay, compileOverlayCandidate, OVERLAY_BASE
overlay-disasm = { path = "../overlay-disasm" }
# Shared with `overlay score`, so the bulk table and the single-owner view
# never disagree about which residuals are worth reading.
candidate-show = { path = "../candidate-show" }
# The adoption gate's audited-interval check, so the table cannot rank a row
# first that the gate will refuse.
overlay-adopt = { path = "../overlay-adopt" }

[lib]
name = "overlay_candidate_rank"
path = "src/lib.rs"

[profile.release]
opt-level = 3
