# Bare `[workspace]`: this crate is its own workspace, so it builds without
# touching `tools/Cargo.toml` and without racing a sibling agent's edits
# there. That also means `version.workspace` / `edition.workspace` cannot
# resolve, so both keys are literal.
[workspace]

[package]
name = "overlay-published"
version = "0.1.0"
edition = "2021"

[dependencies]
# Sibling crates, not third-party dependencies: the already-landed Rust
# halves of the exact TypeScript modules `overlay_published.ts` imports.
#   ../lib/overlay_call_targets.ts -> classify, overlayImage, OVERLAY_BASE, BASE_SHIFT, targetOffset
overlay-call-targets = { path = "../overlay-call-targets" }
#   ../lib/overlay_disasm.ts -> overlayCSpans
overlay-disasm = { path = "../overlay-disasm" }
# `manualRegions` reads `semantic/regions.json`; reuse the already-landed
# insertion-order JSON reader rather than a third reimplementation.
exact-reading-list = { path = "../exact-reading-list" }

[lib]
name = "overlay_published"
path = "src/lib.rs"

[[bin]]
name = "overlay-published"
path = "src/main.rs"

[profile.release]
opt-level = 3
