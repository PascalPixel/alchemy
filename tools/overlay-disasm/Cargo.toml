[workspace]

[package]
name = "overlay-disasm"
version = "0.1.0"
edition = "2021"

[lib]
name = "overlay_disasm"
path = "src/lib.rs"

[dependencies]
# Sibling crates owning the former compiler-module surface. These are not
# third-party dependencies; they are the Rust half of the same tree.
compiler-core = { path = "../compiler-core" }
# `CompilerTarget` lives here. This dependency is read-only for this crate.
cache-entry = { path = "../cache-entry" }
extract-resource = { path = "../extract-resource" }
regex = "1.13.1"
tempfile = "3"

[profile.release]
opt-level = 3
