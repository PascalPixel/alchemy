# Bare `[workspace]`: this crate is an independently buildable workspace
# rather than a member of the aggregate tools workspace. `version`/`edition`
# are literal because `.workspace` inheritance is unavailable here.
[workspace]

[package]
name = "build-claimed"
version = "0.1.0"
edition = "2021"

[lib]
name = "build_claimed"
path = "src/lib.rs"

[dependencies]
# Sibling crates, not third-party dependencies. Each already owns a proved port
# of the layer this tool calls; a second copy of any of them is exactly the
# hand-sync problem the Rust effort exists to end.
alchemy-bundle = { path = "../alchemy-bundle" }
alchemy-plan = { path = "../alchemy-plan" }
alchemy-routing = { path = "../alchemy-routing" }
alchemy-symbols = { path = "../alchemy-symbols" }
decomp-targets = { path = "../decomp-targets" }
cache-entry = { path = "../cache-entry" }
canonical-json = { path = "../canonical-json" }
serde_json = { version = "1", features = ["preserve_order"] }
