# Bare `[workspace]`: this crate is an independently buildable workspace
# rather than a member of the aggregate tools workspace. `version.workspace`
# and `edition.workspace` therefore cannot resolve, so both keys are literal.
[workspace]

[package]
name = "compiler-corpus-regression"
version = "0.1.0"
edition = "2021"
default-run = "compiler-corpus-regression"

[dependencies]
# Sibling crates, not third-party dependencies. Each is a landed slice of the
# legacy implementation this tool imports:
#   candidate-compiler       -> verifyCandidate, ROM_BASE, CandidateCompilerConfiguration,
#                      js_subarray, and the jsnum/jsstring/json JavaScript
#                      semantics layer (canonicalJson lives in candidate_compiler::json)
#   alchemy-bundle  -> compiler_bundle_signature, sha256
#   alchemy-plan    -> CompilerFamily
#   alchemy-routing -> CompilerTarget, root()
# `tools/canonical-json` is NOT used: it inherits `version.workspace` from
# `tools/Cargo.toml` and so is not path-dependable from a bare workspace,
# and it would drag `serde_json` in as this crate's only third-party
# dependency. `candidate_compiler::json` is the same writer over an insertion-ordered
# value type with zero dependencies.
#
# `integrate-matches` owns the canonical `linked_function_extent` implementation;
# this crate consumes that export so linked-size semantics have one source.
candidate-compiler = { path = "../candidate-compiler" }
alchemy-bundle = { path = "../alchemy-bundle" }
alchemy-plan = { path = "../alchemy-plan" }
alchemy-routing = { path = "../alchemy-routing" }
overlay-disasm = { path = "../overlay-disasm" }
integrate-matches = { path = "../integrate-matches" }

[lib]
name = "compiler_corpus_regression"
path = "src/lib.rs"

[[bin]]
name = "compiler-corpus-regression"
path = "src/bin/compiler_corpus_regression.rs"

[[bin]]
name = "compiler-corpus-regression-bench"
path = "src/bin/compiler_corpus_regression_bench.rs"
