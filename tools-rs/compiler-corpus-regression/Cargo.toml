# Bare `[workspace]`: this crate is its own workspace, so it builds without
# touching `tools-rs/Cargo.toml` and without racing a sibling agent's edits
# there. That also means `version.workspace` / `edition.workspace` cannot
# resolve, so both keys are literal.
[workspace]

[package]
name = "compiler-corpus-regression"
version = "0.1.0"
edition = "2021"

[dependencies]
# Sibling crates, not third-party dependencies. Each is a landed slice of the
# TypeScript this tool imports:
#   match-m2c       -> verifyCandidate, ROM_BASE, CandidateCompilerConfiguration,
#                      js_subarray, and the jsnum/jsstring/json JavaScript
#                      semantics layer (canonicalJson lives in match_m2c::json)
#   alchemy-bundle  -> compilerBundleSignature, sha256
#   alchemy-plan    -> CompilerFamily
#   alchemy-routing -> CompilerTarget, root()
# `tools-rs/canonical-json` is NOT used: it inherits `version.workspace` from
# `tools-rs/Cargo.toml` and so is not path-dependable from a bare workspace,
# and it would drag `serde_json` in as this crate's only third-party
# dependency. `match_m2c::json` is the same writer over an insertion-ordered
# value type with zero dependencies.
#
# `tools/lib/integrate_matches.ts`'s `linkedFunctionExtent` is ported HERE, in
# `src/extent.rs`, rather than taken from `tools-rs/integrate-matches`: that
# crate is under concurrent construction by a sibling agent and is off limits
# for this task. See the module header there for the duplication note.
match-m2c = { path = "../match-m2c" }
alchemy-bundle = { path = "../alchemy-bundle" }
alchemy-plan = { path = "../alchemy-plan" }
alchemy-routing = { path = "../alchemy-routing" }

[lib]
name = "compiler_corpus_regression"
path = "src/lib.rs"

[[bin]]
name = "compiler-corpus-regression"
path = "src/bin/compiler_corpus_regression.rs"

[[bin]]
name = "compiler-corpus-regression-bench"
path = "src/bin/compiler_corpus_regression_bench.rs"
