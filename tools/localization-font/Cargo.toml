[workspace]

[package]
name = "localization-font"
version = "0.1.0"
edition = "2021"

[lib]
name = "localization_font"
path = "src/lib.rs"

[[bin]]
name = "localization-font"
path = "src/main.rs"

[dependencies]
alchemy-zlib = { path = "../zlib" }
canonical-json = { path = "../canonical-json" }
export-asset = { path = "../export-asset" }
extract-resource = { path = "../extract-resource" }
import-asset = { path = "../import-asset" }
serde_json = { version = "1", features = ["preserve_order"] }
