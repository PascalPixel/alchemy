[workspace]

[package]
name = "resource-byte-canvases"
version = "0.1.0"
edition = "2021"

[lib]
name = "resource_byte_canvases"
path = "src/lib.rs"

[[bin]]
name = "resource-byte-canvases"
path = "src/main.rs"

[dependencies]
canonical-json = { path = "../canonical-json" }
export-asset = { path = "../export-asset" }
import-asset = { path = "../import-asset" }
serde_json = { version = "1", features = ["preserve_order"] }
