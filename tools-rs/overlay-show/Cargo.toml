# Bare `[workspace]`: this crate is its own workspace so it builds without
# touching `tools-rs/Cargo.toml`, which several agents share concurrently. A
# bare-workspace crate cannot resolve `version.workspace`, so both keys are
# literal.
[workspace]

[package]
name = "overlay-show"
version = "0.1.0"
edition = "2021"

[dependencies]
# Sibling crates, not third-party dependencies: `tools/overlay/overlay_show.ts`
# imports `assembleOverlay`/`OVERLAY_BASE` from `../lib/overlay_disasm.ts` and
# `annotate`/`resolvedCallNames`/`unannotatedCallSites` from
# `../lib/overlay_call_targets.ts`.
overlay-disasm = { path = "../overlay-disasm" }
overlay-call-targets = { path = "../overlay-call-targets" }

[lib]
name = "overlay_show"
path = "src/lib.rs"

[[bin]]
name = "overlay-show"
path = "src/main.rs"

[profile.release]
opt-level = 3
