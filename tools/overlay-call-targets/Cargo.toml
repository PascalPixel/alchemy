# Bare `[workspace]`: this crate is an independently buildable workspace
# rather than a member of the aggregate tools workspace. A bare workspace
# cannot resolve `version.workspace`, so both keys are literal.
[workspace]

[package]
name = "overlay-call-targets"
version = "0.1.0"
edition = "2021"

[dependencies]
# Sibling crate, not a third-party dependency: the already-landed Rust half of
# `../lib/overlay_disasm.ts`, which `tools/lib/overlay_call_targets.ts` imports
# for `assembleOverlay`.
overlay-disasm = { path = "../overlay-disasm" }
serde_json = "1"

[lib]
name = "overlay_call_targets"
path = "src/lib.rs"

[profile.release]
opt-level = 3
