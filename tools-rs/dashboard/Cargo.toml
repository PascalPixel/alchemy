# Self-contained workspace on purpose: this crate must build concurrently with
# its siblings without contending for tools-rs/Cargo.lock. The bare [workspace]
# line below stops Cargo from walking up and joining the parent workspace.
[workspace]

[package]
name = "dashboard"
version = "0.1.0"
edition = "2021"

[dependencies]

[[bin]]
name = "dashboard"
path = "src/main.rs"
