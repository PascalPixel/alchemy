# One workspace, one lockfile, one shared artifact tree for every tool crate.
# Alchemy owns project integration; Psynergy reads and analyses; ags encodes.
[workspace]
resolver = "2"
members = ["ags", "alchemy", "psynergy"]

[workspace.package]
version = "0.1.0"
edition = "2021"

# Every build and test runs with --release. No debug info, no incremental
# cache and stripped executables keep tools/out/cargo-target small.
[profile.release]
debug = false
incremental = false
strip = true

[profile.dev]
debug = false
incremental = false
