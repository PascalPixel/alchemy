# Bare `[workspace]`: this crate is its own workspace, so it builds without
# touching `tools-rs/Cargo.toml` and without racing a sibling agent's edits
# there. That also means `version.workspace` / `edition.workspace` cannot
# resolve, so both keys are literal.
[workspace]

[package]
name = "overlay-twins"
version = "0.1.0"
edition = "2021"

[dependencies]
# Sibling crates, not third-party dependencies: the already-landed Rust
# halves of the exact TypeScript modules `overlay_twins.ts` imports.
#   ../lib/overlay_disasm.ts  -> assembleOverlay, overlayCSpans
overlay-disasm = { path = "../overlay-disasm" }
#   node:fs JSON.parse over out/decomp/overlays.json (~84 MB) -> this crate's
#   minimal JSON reader, already built to handle that file's size.
exact-reading-list = { path = "../exact-reading-list" }
#   `Bun.CryptoHasher("sha256")` -> the hand-written FIPS 180-4 one-shot hex
#   digest. `skeletonDigest` feeds it a byte buffer built up incrementally, so
#   a one-shot hasher over the assembled buffer is equivalent.
alchemy-bundle = { path = "../alchemy-bundle" }

[lib]
name = "overlay_twins"
path = "src/lib.rs"

[[bin]]
name = "overlay-twins"
path = "src/main.rs"

[profile.release]
opt-level = 3
