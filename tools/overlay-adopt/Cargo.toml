[package]
name = "overlay-adopt"
version = "0.1.0"
edition = "2021"

[dependencies]
disassemble = { path = "../disassemble" }
compiler-core = { path = "../compiler-core" }
candidate-compiler = { path = "../candidate-compiler" }
diff = { path = "../diff" }
no-asm-c = { path = "../no-asm-c" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[lib]
name = "overlay_adopt"
path = "src/lib.rs"
