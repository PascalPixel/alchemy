name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ☀️ from a clean clone, with no ROM
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the source and the compilers' source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Initialize only the matching compilers
        run: git submodule update --init --recursive alchemy-gcc

      - name: Confirm the checkout holds no ROM
        run: |
          test ! -e roms
          if find . -name '*.gba' -print | grep .; then exit 1; fi

      - name: Install build tools and clang-format 21
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/llvm-snapshot.asc" https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo install -m 644 "$RUNNER_TEMP/llvm-snapshot.asc" /usr/share/keyrings/llvm-snapshot.asc
          echo 'deb [signed-by=/usr/share/keyrings/llvm-snapshot.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main' | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi gcc-arm-none-eabi pkg-config libpng-dev libutf8proc-dev clang-format-21
          clang-format-21 --version

      - name: Test the tools
        run: make test CARGO=false CLANG_FORMAT=clang-format-21

      - name: Read the compiler pin
        id: pin
        run: echo "alchemy-gcc=$(git rev-parse HEAD:alchemy-gcc)" >> "$GITHUB_OUTPUT"

      - name: Restore the compilers built from that pin
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            tools/out/compilers
            tools/out/compiler-runtime
          key: compilers-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.alchemy-gcc }}-${{ hashFiles('Makefile') }}

      - name: Build the compilers from source (make bootstrap)
        run: make bootstrap CARGO=false

      - name: Build the six ☀️ editions and check each against rom.sha1
        run: make -j"$(nproc)" compare-tbs CARGO=false

      - name: Compile ☀️'s C with a current GCC (make modern)
        run: make -j"$(nproc)" modern
