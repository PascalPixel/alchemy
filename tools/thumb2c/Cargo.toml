[workspace]

[package]
name = "thumb2c"
version = "0.1.0"
edition = "2021"

[lib]
name = "thumb2c"
path = "src/lib.rs"

[[bin]]
name = "thumb2c"
path = "src/main.rs"

[dependencies]
# Sibling crates: the canonical ROM reader and the owner register.
compiler-core = { path = "../compiler-core" }
overlay-disasm = { path = "../overlay-disasm" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = 3
lto = true
