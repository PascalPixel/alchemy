# One workspace, one lockfile, one shared artifact tree for every tool crate.
# Alchemy owns project integration; Psynergy is also a standalone portable tool.
# Each crate is a workspace member and a row in the CONTRIBUTING tooling index.
[workspace]
resolver = "2"
members = ["*"]
exclude = []

[workspace.package]
version = "0.1.0"
edition = "2021"
