# Bare `[workspace]`: this crate is an independently buildable workspace
# rather than a member of the aggregate tools workspace. `version.workspace`
# and `edition.workspace` therefore cannot resolve, so both keys are literal.
[workspace]

[package]
name = "overlay-call-order-check"
version = "0.1.0"
edition = "2021"

[dependencies]
# Sibling crates, not third-party dependencies: the already-landed Rust
# halves of the exact TypeScript modules `overlay_call_order_check.ts` imports.
#   ../lib/discover.ts -> Discovery
discover = { path = "../discover" }
#   ../lib/overlay_call_targets.ts -> OVERLAY_BASE, classify, overlayImage,
#   resolveOverlay, targetOffset
overlay-call-targets = { path = "../overlay-call-targets" }
# `node:fs` JSON.parse over `semantic/regions.json` and
# `out/decomp/overlays.json` -> this crate's insertion-order JSON reader.
exact-reading-list = { path = "../exact-reading-list" }

[lib]
name = "overlay_call_order_check"
path = "src/lib.rs"

[profile.release]
opt-level = 3
