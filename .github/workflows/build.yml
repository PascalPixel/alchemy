name: CI

# The public proof: the six ☀️ editions rebuild from a clean clone with no ROM
# and match rom.sha1. The tool tests, format check, current-GCC build and the
# twelve-edition compare run locally in `make land` before every push to main.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ☀️ from a clean clone, with no ROM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # ccache hands back a compile only when its preprocessed source, compiler
      # and options are identical; every ROM is still linked and checked.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Fetch only the pinned compilers' source
        run: git submodule update --init --recursive --depth 1 alchemy-gcc

      - name: Confirm the checkout holds no ROM
        run: |
          test ! -e roms
          if find . -name '*.gba' -print | grep .; then exit 1; fi

      - name: Install the build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends binutils-arm-none-eabi pkg-config libpng-dev libutf8proc-dev ccache

      - name: Read the compiler pin
        id: pin
        run: echo "compiler=$(git rev-parse HEAD:alchemy-gcc)" >> "$GITHUB_OUTPUT"

      - name: Restore the compilers built from that pin
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            tools/out/compilers
            tools/out/compiler-runtime
          key: compilers-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.compiler }}-${{ hashFiles('Makefile') }}

      - name: Restore earlier compiles
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .ccache
          key: ccache-${{ steps.pin.outputs.compiler }}-${{ github.sha }}
          restore-keys: ccache-${{ steps.pin.outputs.compiler }}-

      - name: Build the compilers if the cache missed (make bootstrap)
        run: make bootstrap CARGO=false

      - name: Build the six ☀️ editions and check each against rom.sha1
        run: |
          make -j"$(nproc)" compare-tbs CARGO=false \
            XGCC="ccache $PWD/tools/out/compilers/xgcc -B$PWD/tools/out/compilers/"
          ccache --show-stats

  publish:
    name: Accept the measurement and publish the site
    needs: build
    if: github.repository == 'PascalPixel/alchemy' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The history is read, never the old blobs.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Fetch the pinned development tools
        id: devtools
        run: |
          git submodule update --init --depth 1 alchemy-devtools
          echo "pin=$(git rev-parse HEAD:alchemy-devtools)" >> "$GITHUB_OUTPUT"

      - name: Restore the development tools built from that pin
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            alchemy-devtools/target
          key: devtools-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ steps.devtools.outputs.pin }}

      - name: Build the development tools if the cache missed
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          make devtools

      - name: Download the durable report archive
        run: gh release download decomp-reports --dir "$RUNNER_TEMP/measured" --pattern '*.tsv' --pattern '*.pb'

      - name: Verify this revision and reconstruct its progress history
        run: alchemy-devtools/target/release/alchemy-devtools progress --publish "$RUNNER_TEMP/measured" "$GITHUB_SHA" "$RUNNER_TEMP/publication"

      - name: Archive the public figures and admit the successful measurement
        run: |
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C "$RUNNER_TEMP/publication" -cf - PROGRESS.png PROGRESS_CHART.png history.tsv source.tsv \
            | gzip -n > "$RUNNER_TEMP/publication/${GITHUB_SHA}.site.tar.gz"
          for name in "${GITHUB_SHA}.site.tar.gz" "${GITHUB_SHA}.accepted.tsv"; do
            path="$RUNNER_TEMP/publication/$name"
            expected="sha256:$(sha256sum "$path" | cut -d' ' -f1)"
            actual=$(gh api "repos/$GH_REPO/releases/tags/decomp-reports" --jq ".assets[] | select(.name == \"$name\") | .digest")
            if test -z "$actual"; then
              gh release upload decomp-reports "$path"
              actual=$(gh api "repos/$GH_REPO/releases/tags/decomp-reports" --jq ".assets[] | select(.name == \"$name\") | .digest")
            fi
            test "$actual" = "$expected" || { echo "Refusing to replace changed archive $name" >&2; exit 1; }
          done

      - name: Hand decomp.dev all twelve editions
        run: cp "$RUNNER_TEMP/measured/${GITHUB_SHA}.pb" "$RUNNER_TEMP/report.pb"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: combined_report
          path: ${{ runner.temp }}/report.pb
          if-no-files-found: error
          retention-days: 90

      - name: Start the site build on Vercel, unless a newer commit is on main
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          latest=$(gh api repos/PascalPixel/alchemy/commits/main --jq .sha)
          if test "$latest" != "$GITHUB_SHA"; then echo "Skipping a superseded revision."; exit 0; fi
          test -n "$HOOK" || { echo 'Set VERCEL_DEPLOY_HOOK: the deploy hook of the alchemy Vercel project.' >&2; exit 1; }
          curl --fail --silent --show-error --request POST "$HOOK"
