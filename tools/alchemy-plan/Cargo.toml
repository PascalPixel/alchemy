# Bare `[workspace]`: this crate is an independently buildable workspace
# rather than a member of the aggregate tools workspace. `version.workspace`
# cannot resolve here, so both keys are literal.
[workspace]

[package]
name = "alchemy-plan"
version = "0.1.0"
edition = "2021"

[dependencies]
# Sibling crates, not third-party dependencies. `alchemy-bundle` owns bundle
# validation and the `compilerCommand*` builders this layer calls; it re-exports
# nothing from `alchemy-routing`, so the routing crate is named directly for
# `cflagsForTargetSource` and friends. A second copy of either is exactly the
# hand-sync problem this effort exists to end.
alchemy-bundle = { path = "../alchemy-bundle" }
alchemy-routing = { path = "../alchemy-routing" }

[lib]
name = "alchemy_plan"
path = "src/lib.rs"
