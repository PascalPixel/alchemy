[workspace]

[package]
name = "runtime-support-data"
version = "0.1.0"
edition = "2021"

[lib]
name = "runtime_support_data"
path = "src/lib.rs"

[[bin]]
name = "runtime-support-data"
path = "src/main.rs"

[dependencies]
canonical-json = { path = "../canonical-json" }
serde_json = { version = "1", features = ["preserve_order"] }
