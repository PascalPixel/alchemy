[workspace]

[package]
name = "alchemy"
version = "0.1.0"
edition = "2021"

[dependencies]
png = "0.17"
decompile = { path = "../decompile" }
candidate-compiler = { path = "../candidate-compiler" }
diff = { path = "../diff" }
compiler-core = { path = "../compiler-core" }
integrate-matches = { path = "../integrate-matches" }
no-asm-c = { path = "../no-asm-c" }
objdiff-core = { version = "3.8.0", default-features = false, features = ["arm", "std"] }
disassemble = { path = "../disassemble" }
matching = { path = "../matching" }
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
walkdir = "2.5"
alignment-tail = { path = "../alignment-tail" }
asset-paths = { path = "../asset-paths" }
audio-engine-data = { path = "../audio-engine-data" }
archive-asset = { path = "../archive-asset" }
battle-assets = { path = "../battle-assets" }
canonical-json = { path = "../canonical-json" }
cache-entry = { path = "../cache-entry" }
extract-resource = { path = "../extract-resource" }
generated-files = { path = "../generated-files" }
import-asset = { path = "../import-asset" }
music = { path = "../music" }
gba-header = { path = "../gba-header" }
sha1 = "0.10"
build-asm = { path = "../build-asm" }
build-claimed = { path = "../build-claimed" }
build-full = { path = "../build-full" }
encounter-data = { path = "../encounter-data" }
character-catalog = { path = "../character-catalog" }
staff-roll = { path = "../staff-roll" }
executable-gap-sources = { path = "../executable-gap-sources" }
music-residuals = { path = "../music-residuals" }
f0-archive = { path = "../f0-archive" }
simple-resources = { path = "../simple-resources" }
kind2-resources = { path = "../kind2-resources" }
skip-sprite-archive = { path = "../skip-sprite-archive" }
static-sprite-series = { path = "../static-sprite-series" }
localization-font = { path = "../localization-font" }
map-container-components = { path = "../map-container-components" }
namae-nyuuryoku = { path = "../namae-nyuuryoku" }
kind1-map-grid = { path = "../kind1-map-grid" }
message-archive = { path = "../message-archive" }
resource-5 = { path = "../resource-5" }
title-resources = { path = "../title-resources" }
runtime-support-data = { path = "../runtime-support-data" }
check-commit-progress = { path = "../check-commit-progress" }
check-publication = { path = "../check-publication" }
check-unmatchable = { path = "../check-unmatchable" }
core-retained-audit = { path = "../core-retained-audit" }
coverage-map = { path = "../coverage-map" }
full-c-progress = { path = "../full-c-progress" }
overlay-adopt = { path = "../overlay-adopt" }
tempfile = "3"

[[bin]]
name = "alchemy"
path = "src/main.rs"
