[package]
name = "build-claimed"
version = "0.1.0"
edition = "2021"

[lib]
name = "build_claimed"
path = "src/lib.rs"

[dependencies]
compiler-core = { path = "../compiler-core" }
candidate-compiler = { path = "../candidate-compiler" }
decomp-targets = { path = "../decomp-targets" }
cache-entry = { path = "../cache-entry" }
canonical-json = { path = "../canonical-json" }
serde_json = { version = "1", features = ["preserve_order"] }
