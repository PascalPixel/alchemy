name: Site

# The docs site is rebuilt from main once a day at most, at midnight UTC, and
# only when main changed that day (.github/publication.md). Run it by hand to
# rebuild at once.

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  site:
    name: Start the docs site build
    if: github.repository == 'PascalPixel/alchemy'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start the site build on Vercel, unless main is as it was a day ago
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          pushed=$(gh api repos/PascalPixel/alchemy/commits/main --jq .commit.committer.date)
          if test "$GITHUB_EVENT_NAME" = schedule && test "$(date -d "$pushed" +%s)" -lt "$(date -d '25 hours ago' +%s)"; then echo "Skipping: main has not changed since $pushed."; exit 0; fi
          test -n "$HOOK" || { echo 'Set VERCEL_DEPLOY_HOOK: the deploy hook of the alchemy Vercel project.' >&2; exit 1; }
          curl --fail --silent --show-error --request POST "$HOOK"
