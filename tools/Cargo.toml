[workspace]
resolver = "2"
members = [
  "alignment-tail",
  "asset-paths",
  "byte-value-regions",
  "cache-entry",
  "cache-key-lint",
  "canonical-json",
  "dispatch",
  "generated-files",
  "jobs",
  "lang-ban",
  "map-load-table",
  "no-asm-c",
  "pairtable",
  "text-bg",
  "tilemap",
  "wordstream",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = true
