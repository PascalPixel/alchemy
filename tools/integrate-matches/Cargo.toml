# Bare `[workspace]`: this crate is its own workspace, so it builds without
# touching `tools/Cargo.toml` and without racing a sibling agent's edits
# there. That also means `version.workspace` / `edition.workspace` cannot
# resolve, so both keys are literal.
[workspace]

[package]
name = "integrate-matches"
version = "0.1.0"
edition = "2021"

[dependencies]
# Sibling crates, not third-party dependencies. `integrate-matches` imports
# exactly three names from the compiler surface, and they live in two native
# crates:
#   alchemy-plan    -> sourceToAssemblyPlan (+ nodepath basename/extname)
#   alchemy-symbols -> externalSymbol, externalSymbolAssembly, CALL_VIA_BASE
alchemy-plan = { path = "../alchemy-plan" }
alchemy-symbols = { path = "../alchemy-symbols" }
# `root()`, the repository root, and `CompilerTarget::Gs1` for the fixed
# `target: "gs1"` this tool passes.
alchemy-routing = { path = "../alchemy-routing" }
# The JavaScript-semantics layer provided by `candidate-compiler`:
# `parse_hex`/`hex8` (the ONE numeric-parse helper this crate routes through),
# and `js_trim`/`js_split_lines`/`js_split_whitespace_runs`/`utf16_cmp`.
# Re-deriving any of them here is the hand-sync problem the ports exist to end.
candidate-compiler = { path = "../candidate-compiler" }

# No third-party dependencies. This tool writes plain text lines and reads `nm`
# output; there is no JSON in it, so `serde_json` never comes up.

[lib]
name = "integrate_matches"
path = "src/lib.rs"

[[bin]]
name = "integrate-matches"
path = "src/bin/integrate_matches.rs"

[[bin]]
name = "integrate-matches-bench"
path = "src/bin/integrate_matches_bench.rs"
