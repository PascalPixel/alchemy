# Bare `[workspace]`: this crate is an independently buildable workspace
# rather than a member of the aggregate tools workspace. `version.workspace`
# and `edition.workspace` therefore cannot resolve, so both keys are literal.
[workspace]

[package]
name = "integrate-matches"
version = "0.1.0"
edition = "2021"

[dependencies]
# Sibling crates, not third-party dependencies. `integrate-matches` imports
# exactly three names from the compiler surface, and they live in two native
# crates:
#   compiler-core -> compilation plans, node-style paths, and external symbols
compiler-core = { path = "../compiler-core" }
# `root()`, the repository root, and `CompilerTarget::Gs1` for the fixed
# `target: "gs1"` this tool passes.
regex = "1.13.1"

[lib]
name = "integrate_matches"
path = "src/lib.rs"
