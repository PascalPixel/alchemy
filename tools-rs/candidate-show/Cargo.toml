# Bare `[workspace]`: this crate is its own workspace, so it builds without
# touching `tools-rs/Cargo.toml` and without racing a sibling agent's edits
# there. That also means `version.workspace` / `edition.workspace` cannot
# resolve, so both keys are literal.
[workspace]

[package]
name = "candidate-show"
version = "0.1.0"
edition = "2021"

[dependencies]
# Sibling crates, not third-party dependencies.
#   match-m2c       -> verifyCandidate, ROM_BASE, CandidateCompilerConfiguration,
#                      CandidateCompilerFamily, and the JavaScript-semantics
#                      modules (`jsnum`, `jsstring`, `json`) the port leans on.
#                      `candidate_show.ts` imports the first four from
#                      `./match_m2c.ts` directly.
#   alchemy-routing -> `root()` (the repository root) and `CompilerTarget`.
# Everything `alchemy_gcc.ts` supplies is reached transitively through
# `match-m2c`; `candidate_show.ts` never imports it by name.
match-m2c = { path = "../match-m2c" }
alchemy-routing = { path = "../alchemy-routing" }

[lib]
name = "candidate_show"
path = "src/lib.rs"

[[bin]]
name = "candidate-show"
path = "src/bin/candidate_show.rs"

# The differential parity harness against the live TypeScript.
[[bin]]
name = "candidate-show-drift"
path = "src/bin/candidate_show_drift.rs"
