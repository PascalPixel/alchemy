[workspace]

[package]
name = "build-stage"
version = "0.1.0"
edition = "2021"

[dependencies]
build-asm = { path = "../build-asm" }
build-claimed = { path = "../build-claimed" }
build-full = { path = "../build-full" }
build-rom = { path = "../build-rom" }

# `build` is a forbidden binary name: cargo reserves it for build directories.
[[bin]]
name = "build-stage"
path = "src/main.rs"
