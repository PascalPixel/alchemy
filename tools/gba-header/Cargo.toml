[workspace]

[package]
name = "gba-header"
version = "0.1.0"
edition = "2021"

[lib]
name = "gba_header"
path = "src/lib.rs"

[dependencies]
canonical-json = { path = "../canonical-json" }
import-asset = { path = "../import-asset" }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
