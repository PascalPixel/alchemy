# Bare `[workspace]`: this crate is its own workspace, so it builds without
# touching `tools-rs/Cargo.toml` and without racing a sibling agent's edits
# there. That also means `version.workspace` / `edition.workspace` cannot
# resolve, so both keys are literal.
[workspace]

[package]
name = "candidate-explain"
version = "0.1.0"
edition = "2021"

[dependencies]
# Sibling crates, not third-party dependencies: these are the already-landed
# Rust halves of the exact TypeScript modules `candidate_explain.ts` imports.
#   ./overlay_disasm.ts -> assembleOverlay, compileOverlayCandidate, OVERLAY_BASE
overlay-disasm = { path = "../overlay-disasm" }
#   candidate-compiler -> candidate verification and ROM_BASE
candidate-compiler = { path = "../candidate-compiler" }
#   ./rtl_insn.ts       -> RtlInsn, calleeSymbol, parseInsns
rtl-insn = { path = "../rtl-insn" }
#   ./thumb_disasm.ts   -> Instruction, parseInstruction
thumb-disasm = { path = "../thumb-disasm" }
#   ./rtl_align.ts      -> align
rtl-align = { path = "../rtl-align" }
#   ./rtl_schedule.ts   -> DependenceRow, PairComparison, ScheduleContext,
#                          diagnose, parseDependenceTable
rtl-schedule = { path = "../rtl-schedule" }
#   `root()` (the repository root, this tool's `ROOT`) and `CompilerTarget`.
alchemy-routing = { path = "../alchemy-routing" }
#   node:path `basename` / `extname`, used for the routing-stem derivation.
alchemy-plan = { path = "../alchemy-plan" }

# Zero third-party dependencies. Every JS-semantics primitive this port needs
# (ToNumber, ToString(Number), parseInt, UTF-16 padding) is either reused from
# a sibling crate or reimplemented in `src/jsnum.rs`.

[lib]
name = "candidate_explain"
path = "src/lib.rs"

[[bin]]
name = "candidate-explain"
path = "src/bin/candidate_explain.rs"
