[workspace]

[package]
name = "compare-roms"
version = "0.1.0"
edition = "2021"

[lib]
name = "compare_roms"
path = "src/lib.rs"

[[bin]]
name = "compare-roms"
path = "src/main.rs"

[dependencies]
canonical-json = { path = "../canonical-json" }
serde_json = { version = "1", features = ["preserve_order"] }
