[package]
name = "compiler-core"
version = "0.1.0"
edition = "2021"

[dependencies]
psynergy = { path = "../psynergy" }
fs2 = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
tempfile = "3"

[lib]
name = "compiler_core"
path = "src/lib.rs"
