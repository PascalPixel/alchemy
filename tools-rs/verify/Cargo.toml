[workspace]

[package]
name = "verify"
version = "0.1.0"
edition = "2021"

[dependencies]
alchemy-routing = { path = "../alchemy-routing" }
# The approved-digest tables moved here from alchemy-routing on 2026-08-07;
# they are bundle-admission data, and only this crate has a gate for them.
alchemy-bundle = { path = "../alchemy-bundle" }

[lib]
name = "verify"
path = "src/lib.rs"

[[bin]]
name = "verify"
path = "src/main.rs"
