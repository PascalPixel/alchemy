[workspace]

[package]
name = "overlay-disasm"
version = "0.1.0"
edition = "2021"

[lib]
name = "overlay_disasm"
path = "src/lib.rs"

[[bin]]
name = "overlay-disasm"
path = "src/main.rs"

[dependencies]
# Sibling crates carved out of tools/lib/alchemy_gcc.ts. These are not
# third-party dependencies; they are the Rust half of the same tree.
alchemy-symbols = { path = "../alchemy-symbols" }
alchemy-plan = { path = "../alchemy-plan" }
alchemy-bundle = { path = "../alchemy-bundle" }
# `CompilerTarget` lives here. Read-only: another agent is live in this crate.
alchemy-routing = { path = "../alchemy-routing" }
discover = { path = "../discover" }
cache-entry = { path = "../cache-entry" }

[profile.release]
opt-level = 3
