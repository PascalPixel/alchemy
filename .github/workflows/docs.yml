name: Publish docs

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Alchemy CI run to publish
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'PascalPixel/alchemy' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event != 'pull_request'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify the successful source run and reject stale publications
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/PascalPixel/alchemy/actions/runs/$RUN_ID" > "$RUNNER_TEMP/run.json"
          jq -e '.path == ".github/workflows/build.yml" and .head_branch == "main" and .conclusion == "success" and (.event == "push" or .event == "workflow_dispatch") and .head_repository.full_name == "PascalPixel/alchemy"' "$RUNNER_TEMP/run.json"
          source=$(jq -r .head_sha "$RUNNER_TEMP/run.json")
          latest=$(gh api repos/PascalPixel/alchemy/commits/main --jq .sha)
          if test "$source" = "$latest"; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping a superseded source revision."
          fi

      - name: Start the site build on Vercel
        if: steps.source.outputs.current == 'true'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          test -n "$HOOK" || { echo 'Set VERCEL_DEPLOY_HOOK: the deploy hook of the alchemy Vercel project.' >&2; exit 1; }
          curl --fail --silent --show-error --request POST "$HOOK"
