# Bare `[workspace]`: this crate is an independently buildable workspace
# rather than a member of the aggregate tools workspace.
[workspace]

[package]
name = "reverse-gcc296"
version = "0.1.0"
edition = "2021"

[dependencies]
# Sibling crate, not a third-party dependency.
#   alchemy-permuter -> `mutate()`, its 34 AST-based randomization passes.
# Reusing that engine rather than reimplementing it: three of this crate's own
# line-based rewrites duplicated passes the permuter already had on a real AST.
alchemy-permuter = { path = "../alchemy-permuter" }

# The scorer shells out to the already-built `candidate-show` and to the ARM
# objdump, both of which the repository already requires.

[lib]
name = "reverse_gcc296"
path = "src/lib.rs"

[[bin]]
name = "reverse-gcc296"
path = "src/bin/reverse_gcc296.rs"
