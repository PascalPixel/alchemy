name: Public source checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools-and-policy:
    name: ROM-free tools and source policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/tools/out/cargo-target
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - name: Check out source and approved compiler sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt

      - name: Fetch locked public Rust dependencies
        run: cargo fetch --locked --manifest-path tools/Cargo.toml

      - name: Build the source checker
        run: cargo build --locked --offline --release --manifest-path tools/Cargo.toml -p alchemy

      - name: Build pinned binutils for synthetic ELF tests
        run: tools/out/cargo-target/release/alchemy bootstrap --binutils

      - name: Test coverage failure paths and veneer relocation with synthetic objects
        run: >-
          env PATH="$PWD/tools/out/binutils/bin:$PATH"
          cargo test --locked --offline --release --manifest-path tools/Cargo.toml
          -p alchemy --bin alchemy -- coverage::calcrom::tests::symbol_inspection_
          build_rom::tests::overlay_veneers_keep_their_targets_when_preceding_data_grows

      - name: Test asset encoders and analysis tools on synthetic inputs
        run: |
          cargo test --locked --offline --release --manifest-path tools/Cargo.toml -p ags
          cargo test --locked --offline --release --manifest-path tools/Cargo.toml -p alchemy --bin alchemy -- deps:: similar:: worst:: thumb:: decode:: elf:: cache:: process:: boot::

      - name: Test Alchemy commands and relocated build caches
        run: cargo test --locked --offline --release --manifest-path tools/Cargo.toml -p alchemy --test build_script

      - name: Test publication, routing, parsing and guarded rewrites
        run: >-
          cargo test --locked --offline --release --manifest-path tools/Cargo.toml
          -p alchemy --bin alchemy -- --include-ignored
          check::publication:: check::layout::
          compiler::routing::target_tests::only_ compiler::no_asm:: compiler::steering:: compiler::c_syntax::
          verify::tests::

      - name: Check public source and pinned compiler provenance
        run: >-
          make ALCHEMY=tools/out/cargo-target/release/alchemy
          source-check language-check compiler-source-check

  tbs-from-source:
    name: ☀️ from a clean clone, with no ROM
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/tools/out/cargo-target
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - name: Check out source and approved compiler sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Confirm the checkout holds no ROM
        run: |
          test ! -e roms
          if find . -name '*.gba' -print | grep .; then exit 1; fi

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Read the compiler pin
        id: pin
        run: echo "agscc=$(git rev-parse HEAD:agscc)" >> "$GITHUB_OUTPUT"

      - name: Restore the compilers built from that pin
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            tools/out/compilers
            tools/out/binutils
          key: compilers-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.agscc }}-${{ hashFiles('tools/alchemy/src/bootstrap.rs', 'tools/alchemy/src/compiler/bundle.rs', 'tools/alchemy/src/compiler/bundle_data.rs') }}

      - name: Build the compilers from source (make bootstrap)
        run: make bootstrap

      - name: Build the six ☀️ editions and check each against rom.sha1
        run: make compare-tbs
