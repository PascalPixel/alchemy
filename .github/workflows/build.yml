name: CI

# The public proof: all twelve editions, ☀️'s six and ⚓️'s six, rebuild from a
# clean clone with no ROM and match rom.sha1. On main, the docs site is then
# rebuilt (.github/publication.md).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ☀️ and ⚓️ from a clean clone, with no ROM
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # ccache hands back a compile only when its preprocessed source, compiler
      # and options are identical; every ROM is still linked and checked.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Fetch only the pinned compilers' source
        run: git submodule update --init --recursive --depth 1 alchemy-gcc

      - name: Confirm the checkout holds no ROM
        run: |
          test ! -e roms
          if find . -name '*.gba' -print | grep .; then exit 1; fi

      - name: Install the build tools
        run: |
          sudo apt-get -o Acquire::Retries=5 update -q
          sudo apt-get -o Acquire::Retries=5 install -yq --no-install-recommends binutils-arm-none-eabi libpng-dev ccache

      - name: Read the compiler pin
        id: pin
        run: echo "compiler=$(git rev-parse HEAD:alchemy-gcc)" >> "$GITHUB_OUTPUT"

      - name: Restore the compilers built from that pin
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            tools/out/compilers
            tools/out/compiler-runtime
          key: compilers-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.compiler }}-${{ hashFiles('Makefile') }}

      - name: Restore earlier compiles
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .ccache
          key: ccache-${{ steps.pin.outputs.compiler }}-${{ github.sha }}
          restore-keys: ccache-${{ steps.pin.outputs.compiler }}-

      - name: Build the compilers if the cache missed (make bootstrap)
        run: make bootstrap

      - name: Build the six ☀️ editions and check each against rom.sha1
        run: |
          make -j"$(nproc)" compare-tbs \
            XGCC="ccache $PWD/tools/out/compilers/xgcc -B$PWD/tools/out/compilers/"
          ccache --show-stats

      - name: Build the six ⚓️ editions and check each against rom.sha1
        run: |
          make -j"$(nproc)" compare-tla \
            XGCC="ccache $PWD/tools/out/compilers/xgcc -B$PWD/tools/out/compilers/"
          ccache --show-stats

  site:
    name: Start the docs site build
    needs: build
    if: github.repository == 'PascalPixel/alchemy' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start the site build on Vercel, unless a newer commit is on main
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          latest=$(gh api repos/PascalPixel/alchemy/commits/main --jq .sha)
          if test "$latest" != "$GITHUB_SHA"; then echo "Skipping a superseded revision."; exit 0; fi
          test -n "$HOOK" || { echo 'Set VERCEL_DEPLOY_HOOK: the deploy hook of the alchemy Vercel project.' >&2; exit 1; }
          curl --fail --silent --show-error --request POST "$HOOK"
