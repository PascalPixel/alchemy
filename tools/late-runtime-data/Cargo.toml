[workspace]

[package]
name = "late-runtime-data"
version = "0.1.0"
edition = "2021"

[lib]
name = "late_runtime_data"
path = "src/lib.rs"

[[bin]]
name = "late-runtime-data"
path = "src/main.rs"

[dependencies]
canonical-json = { path = "../canonical-json" }
extract-resource = { path = "../extract-resource" }
serde_json = { version = "1", features = ["preserve_order"] }
