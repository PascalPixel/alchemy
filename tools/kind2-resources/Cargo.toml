[workspace]

[package]
name = "kind2-resources"
version = "0.1.0"
edition = "2021"

[lib]
name = "kind2_resources"
path = "src/lib.rs"

[[bin]]
name = "kind2-resources"
path = "src/main.rs"

[dependencies]
import-asset = { path = "../import-asset" }
serde_json = { version = "1", features = ["preserve_order"] }
