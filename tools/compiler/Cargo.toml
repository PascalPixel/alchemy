[workspace]

[package]
name = "compiler"
version = "0.1.0"
edition = "2021"

[dependencies]
candidate-compiler = { path = "../candidate-compiler" }
candidate-show = { path = "../candidate-show" }
compiler-core = { path = "../compiler-core" }
dashboard-server = { path = "../dashboard-server" }
no-asm-c = { path = "../no-asm-c" }
objdiff-core = { version = "3.8.0", default-features = false, features = ["arm", "std"] }
overlay-disasm = { path = "../overlay-disasm" }
permuter = { path = "../permuter" }
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-escape = "0.1"
# objdiff 3.8.0's release CLI is locked to 3.1.1. Version 3.2 changes the
# instruction alignment and therefore its scores for identical object files.
similar = { version = "=3.1.1", default-features = false, features = ["hashbrown"] }
walkdir = "2.5"

[[bin]]
name = "compiler"
path = "src/main.rs"
