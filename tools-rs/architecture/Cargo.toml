[workspace]

[package]
name = "architecture"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

# The two definitions architecture.ts imports rather than restating, imported
# here for the same reason. `retiredTools` was inlined into this crate once and
# had already drifted from the source-citations port (JS `\s` here, ASCII there);
# two hand-synced copies of a gate's rule is the drift these gates exist to
# catch. Path deps between bare-`[workspace]` crates resolve fine.
[dependencies]
documented = { path = "../documented" }
source-citations = { path = "../source-citations" }

[[bin]]
name = "architecture"
path = "src/main.rs"
